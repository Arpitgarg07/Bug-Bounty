<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        .loader-container {
            text-align: center;
            color: white;
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0;
            font-size: 24px;
        }
        p {
            margin: 10px 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="loader"></div>
        <h2>Signing you in...</h2>
        <p>Please wait while we complete your authentication</p>
    </div>

    <script>
        // Extract tokens from URL
        const urlParams = new URLSearchParams(window.location.search);
        const accessToken = urlParams.get('access_token');
        const refreshToken = urlParams.get('refresh_token');
        const error = urlParams.get('error');

        if (error) {
            alert('Authentication failed. Please try again.');
            window.location.href = 'login.html';
        } else if (accessToken && refreshToken) {
            // Save tokens to localStorage
            localStorage.setItem('bb_access_token', accessToken);
            localStorage.setItem('bb_refresh_token', refreshToken);

            // Fetch user data
            fetch('http://localhost:4000/api/v1/auth/me', {
                headers: {
                    'Authorization': `Bearer ${accessToken}`
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.data) {
                    localStorage.setItem('bb_user', JSON.stringify(data.data));
                    window.location.href = 'discover.html';
                } else {
                    throw new Error('Failed to fetch user data');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Authentication completed but failed to fetch user data. Please try logging in again.');
                window.location.href = 'login.html';
            });
        } else {
            alert('Invalid authentication response. Please try again.');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
